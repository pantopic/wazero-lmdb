name: gocover

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Set up Tinygo
      uses: acifani/setup-tinygo@v3

    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Build WASM Go
      run: make wasm-go

    - name: Build WASM Zig
      run: make wasm-zig

    - name: Cover Host Wazero LMDB
      run: make cover

    - name: Update Host coverage badge
      uses: ncruces/go-coverage-report@v0.3.1
      with:
        coverage-file: _dist/coverage.out
        module-dir: host-wazero-lmdb
        output-dir: host-wazero-lmdb
      continue-on-error: true
